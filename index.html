<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chrismania: RFS Stump Run</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  /* dvh keeps the game clear of mobile browser chrome; the safe-area
     padding keeps it out from under notches and home indicators */
  html,body{margin:0;height:100vh;height:100dvh;background:#14161c;overflow:hidden;
    overscroll-behavior:none;touch-action:none;font-family:monospace;
    -webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center;box-sizing:border-box;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #wrap{position:relative;width:min(100%,177.7vh);width:min(100%,177.7dvh);aspect-ratio:16/9;max-height:100%}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  /* fullscreen: fill the screen but letterbox to keep 16:9 pixels square */
  #wrap:fullscreen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;background:#14161c}
  #wrap:-webkit-full-screen{width:100vw;height:100vh;max-height:none;aspect-ratio:auto;background:#14161c}
  #wrap:fullscreen canvas{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
  #wrap:-webkit-full-screen canvas{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,177.78vh);height:min(56.25vw,100vh)}
  #c{image-rendering:pixelated;image-rendering:crisp-edges}
  #ui{pointer-events:none}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #rotate{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#20242ecc;color:#f2ead8;padding:6px 12px;border-radius:4px;font-size:12px;pointer-events:none}
  @media (orientation:portrait) and (max-width:600px){ #rotate{display:block} }
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="320" height="180" aria-label="Chrismania: RFS Stump Run game"></canvas>
<canvas id="ui" width="1280" height="720"></canvas>
</div>
<div id="rotate">Rotate your phone for the best view</div>
<div id="status" class="sr" role="status" aria-live="polite"></div>
<script src="settings.js"></script>
<script>
"use strict";
/* ================= CONFIG =================
   Defaults only - tweak values in settings.js, which overrides these.
   Sizes are in internal pixels (320x180 canvas). */
const CFG = Object.assign({
  GRAVITY: 0.30,             // per 60Hz tick
  JUMP_VELOCITY: -6.0,
  JUMP_CUT: -2.2,            // release-early velocity cap (variable jump)
  JUMP_BUFFER_TICKS: 7,      // press slightly before landing still jumps
  COYOTE_TICKS: 5,           // grace after leaving the ground
  BASE_SPEED: 2.0,
  MAX_SPEED: 4.6,
  SPEED_RAMP: 0.00035,       // speed += dist * ramp
  SPAWN_MIN: 170, SPAWN_VAR: 150, SPAWN_SPEED_PAD: 22,
  BIG_STUMP_CHANCE: 0.3, PAIR_CHANCE: 0.2, PAIR_MIN_SPEED: 3.1,
  MEDAL_MIN: 260, MEDAL_VAR: 240, MEDAL_ON_STUMP_CHANCE: 0.5,
  LIVES: 3,
  HITSTOP_TICKS: 14,         // freeze-frame on impact
  INVULN_TICKS: 100,         // flashing grace period after a hit
  SPECIAL_CHARGE_REQUIRED: 5,
  SPECIAL_DURATION: 48,      // ~0.8s @60
  SPECIAL_ACTIVE_START: 12,  // windup ends   (~0.25)
  SPECIAL_ACTIVE_END: 31,    // strike ends   (~0.65)
  SPECIAL_ATTACK_RANGE: 150, // px ahead of the bull bar
  SPECIAL_DESTROY_BONUS: 250,
  CLEAR_BONUS: 50,           // airborne stump clear
  MEDAL_BONUS: 25,
  FIRE_MIN_SPEED: 3.4,       // stumps can catch fire above this speed
  FIRE_CHANCE: 0.45,         // max odds of a flaming stump (scales up with speed)
  FIRE_EXTRA_HEIGHT: 6,      // extra hitbox height from the flames
  CAPTAIN_MIN_GAP: 2200,     // px between captain visits
  CAPTAIN_GAP_VAR: 2600,
  BRETT_MIN_GAP: 3800,       // px between Brett appearances (much rarer than Steve)
  BRETT_GAP_VAR: 3200,
  STEVE_X: 168,              // screen x where Steve holds while running alongside
  STEVE_Y_OFFSET: 6,         // px below the ground line for Steve's lane (fence/cow/pat too)
  COW_POOP_OFFSET_X: 150,    // px ahead of Steve where the cow stops to do the deed
  POOP_DELAY_TICKS: 90,      // how long Steve shouts before the fence-and-cow sequence
  BRETT_SPAWN_X: 344,        // screen x where Brett walks in (>320 = off the right edge)
  BRETT_Y_OFFSET: 0,         // px below the ground line for Brett
  BRETT_HOLD_X: 240,         // screen x where Brett hangs about lecturing
  BRETT_HOLD_TICKS: 160,     // how long he stays there (60/sec)
  CAMEO_COOLDOWN: 600,       // px of driving after Steve/Brett leaves before the next cameo
  MUSIC: true,               // background chiptune
  MUSIC_VOLUME: 0.7,         // 0..1
  MUSIC_SPEEDUP: true,       // song speeds up with the run
  MUSIC_SPEEDUP_RATIO: 0.5,  // how much faster at max speed (0.5 = 50% faster)
  SHOW_COW: true,            // the cow does the deed before Steve trips
  SHOW_FENCE: true,          // barbed-wire fence Steve hops before the pat
  DEBUG_COLLISION_BOXES: false
}, window.GAME_SETTINGS || {});
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv = document.getElementById('c'), g = cv.getContext('2d');
const uv = document.getElementById('ui'), ug = uv.getContext('2d');
const S = 4;   // text overlay renders at 4x for crisp, readable type
const statusEl = document.getElementById('status');
g.imageSmoothingEnabled = false;
const W = 320, H = 180, GY = 152;
const P = (x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x|0,y|0,Math.ceil(w),Math.ceil(h)); };
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

let state='title', t=0, dist=0, speed=CFG.BASE_SPEED, score=0, stumpsCleared=0, smashed=0;
let hs = +(ls.get('cm_hs')||0), newBest=false;
const truck = { x:42, y:GY, vy:0, ground:true };
let stumps=[], medals=[], parts=[], nextSpawn=W+160, nextMedal=200;
let power=0, special=0, lives=CFG.LIVES;
let hitstop=0, invuln=0, redFlash=0, jumpBuf=0, coyote=0;
let dead=0, shake=0, mute = ls.get('cm_mute')==='1';

/* the captain's greatest hits - short so they stay readable */
const NAGS = [
  ["CHRIS! THE HOSES!","AGAIN?!"],
  ["CHRIS! DID YOU","DO SMEACS?!"],
  ["WHAT HAVE YOU","DONE ALL DAY?!"],
  ["YOU LEFT THE","SHED UNLOCKED!"],
  ["GET BACK HERE,","CHRIS!"],
  ["ROLL THE HOSES,","CHRIS!"],
  ["THE LOG BOOK'S","EMPTY AGAIN!"],
  ["SLOW DOWN,","CHRIS!"]
];
let captain=null, nextCaptain=1400;

/* Brett's perfectionist station wisdom - he IS an obstacle, jump him */
const BRETT_NAGS = [
  ["RE-ROLL THAT HOSE.","IT'S 2CM OFF!"],
  ["WATCH OUT FOR","THAT STUMP!"],
  ["TURN THE BATHROOM","LIGHT OFF!"],
  ["STOP EATING ALL","THE SAUSAGES!"]
];
let brett=null, nextBrett=2600, cameoCooldown=0;

function announce(s){ statusEl.textContent = s; }

/* ---------- tiny sfx ---------- */
let AC=null;
function sfx(k){
  if(mute) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), v=AC.createGain(); o.connect(v); v.connect(AC.destination);
    const n=AC.currentTime;
    if(k==='jump'){ o.type='square'; o.frequency.setValueAtTime(230,n); o.frequency.exponentialRampToValueAtTime(540,n+.12); v.gain.setValueAtTime(.07,n); v.gain.exponentialRampToValueAtTime(.001,n+.18); o.start(n); o.stop(n+.2); }
    else if(k==='land'){ o.type='square'; o.frequency.setValueAtTime(160,n); o.frequency.exponentialRampToValueAtTime(90,n+.07); v.gain.setValueAtTime(.05,n); v.gain.exponentialRampToValueAtTime(.001,n+.09); o.start(n); o.stop(n+.1); }
    else if(k==='medal'){ o.type='sine'; o.frequency.setValueAtTime(920,n); o.frequency.exponentialRampToValueAtTime(1500,n+.09); v.gain.setValueAtTime(.09,n); v.gain.exponentialRampToValueAtTime(.001,n+.16); o.start(n); o.stop(n+.17); }
    else if(k==='ready'){ o.type='square'; o.frequency.setValueAtTime(660,n); o.frequency.setValueAtTime(880,n+.09); o.frequency.setValueAtTime(1320,n+.18); v.gain.setValueAtTime(.08,n); v.gain.exponentialRampToValueAtTime(.001,n+.3); o.start(n); o.stop(n+.32); }
    else if(k==='punch'){ o.type='sawtooth'; o.frequency.setValueAtTime(120,n); o.frequency.exponentialRampToValueAtTime(30,n+.35); v.gain.setValueAtTime(.16,n); v.gain.exponentialRampToValueAtTime(.001,n+.4); o.start(n); o.stop(n+.42); }
    else if(k==='pop'){ o.type='square'; o.frequency.setValueAtTime(420,n); o.frequency.exponentialRampToValueAtTime(120,n+.1); v.gain.setValueAtTime(.06,n); v.gain.exponentialRampToValueAtTime(.001,n+.12); o.start(n); o.stop(n+.13); }
    else if(k==='crash'){ o.type='triangle'; o.frequency.setValueAtTime(150,n); o.frequency.exponentialRampToValueAtTime(28,n+.55); v.gain.setValueAtTime(.15,n); v.gain.exponentialRampToValueAtTime(.001,n+.6); o.start(n); o.stop(n+.62); }
    else if(k==='nag'){ o.type='square'; o.frequency.setValueAtTime(520,n); o.frequency.setValueAtTime(390,n+.09); o.frequency.setValueAtTime(470,n+.18); v.gain.setValueAtTime(.06,n); v.gain.exponentialRampToValueAtTime(.001,n+.26); o.start(n); o.stop(n+.28); }
    else if(k==='smash'){
      // deep boom with a woody crack of noise
      o.type='sawtooth'; o.frequency.setValueAtTime(180,n); o.frequency.exponentialRampToValueAtTime(35,n+.3);
      v.gain.setValueAtTime(.18,n); v.gain.exponentialRampToValueAtTime(.001,n+.35); o.start(n); o.stop(n+.36);
      const buf=AC.createBuffer(1,(AC.sampleRate*.12)|0,AC.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const nz=AC.createBufferSource(), nv=AC.createGain();
      nz.buffer=buf; nz.connect(nv); nv.connect(AC.destination);
      nv.gain.setValueAtTime(.15,n); nz.start(n);
    }
  }catch(e){}
}
function toggleMute(){
  mute=!mute; ls.set('cm_mute', mute?'1':'0');
  if(mute) stopMusic(); else if(state==='play') startMusic();
}

/* ---------- fullscreen ---------- */
const wrap = document.getElementById('wrap');
const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const isFs = ()=> !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFullscreen(){
  if(!fsOK) return;
  try{
    if(!isFs()){
      const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
      if(req) req.call(wrap);
    } else {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document);
    }
  }catch(e){}
}

/* ---------- rotate: lock to landscape (phones only) ---------- */
const canRotate = !!(screen.orientation && screen.orientation.lock) && matchMedia('(pointer: coarse)').matches;
let rotLocked = false;
async function toggleRotate(){
  if(!canRotate) return;
  try{
    if(rotLocked){ screen.orientation.unlock(); rotLocked=false; return; }
    // Android needs fullscreen before an orientation lock will be granted
    if(!isFs()){
      const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen;
      if(req) await req.call(wrap);
    }
    await screen.orientation.lock('landscape');
    rotLocked = true;
  }catch(e){ rotLocked = false; }   // iOS and some browsers refuse; harmless
}

/* ---------- background music: urgent callout chiptune (no sirens) ---------- */
const MEL  = [0,null,12,null, 7,3,7,null, 0,null,12,null, 8,7,3,null, 8,null,15,null, 12,8,12,null, 10,null,14,null, 12,10,7,5];
const BARS = [0,0,8,10];
let musicId=null, musicStep=0, musicNext=0;
function mnote(f, when, dur, type, vol){
  const o=AC.createOscillator(), v=AC.createGain();
  o.type=type; o.frequency.value=f; o.connect(v); v.connect(AC.destination);
  v.gain.setValueAtTime(vol, when);
  v.gain.exponentialRampToValueAtTime(.001, when+dur);
  o.start(when); o.stop(when+dur+.02);
}
function musicLoop(){
  if(state!=='play' || mute || !CFG.MUSIC){ musicId=null; return; }
  const V=CFG.MUSIC_VOLUME;
  const prog = Math.max(0, Math.min(1, (speed-CFG.BASE_SPEED)/(CFG.MAX_SPEED-CFG.BASE_SPEED)));
  const ramp = CFG.MUSIC_SPEEDUP ? prog*CFG.MUSIC_SPEEDUP_RATIO : 0;
  const stepDur = .135/(1+ramp);     // urgency builds as the run speeds up
  while(musicNext < AC.currentTime + .25){
    const s=musicStep%32, m=MEL[s];
    if(m!==null) mnote(220*Math.pow(2,m/12), musicNext, .09, 'square', .08*V);
    mnote(110*Math.pow(2,BARS[(s>>3)%4]/12), musicNext, .08, 'sawtooth', .07*V);   // driving 8th-note bass
    if((s&1)===1) mnote(5200, musicNext, .02, 'square', .02*V);                    // hat tick
    musicNext += stepDur; musicStep++;
  }
  musicId = setTimeout(musicLoop, 60);
}
function startMusic(){
  if(mute || !CFG.MUSIC || musicId) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    musicNext = Math.max(musicNext, AC.currentTime + .05);
    musicLoop();
  }catch(e){}
}
function stopMusic(){ if(musicId){ clearTimeout(musicId); musicId=null; } }

/* ---------- special-move phase helpers ---------- */
const spElapsed = ()=> CFG.SPECIAL_DURATION - special;
const spWindup  = ()=> special>0 && spElapsed() <  CFG.SPECIAL_ACTIVE_START;
const spActive  = ()=> special>0 && spElapsed() >= CFG.SPECIAL_ACTIVE_START && spElapsed() < CFG.SPECIAL_ACTIVE_END;

/* ---------- the polished sprite: Chris on the RFS truck ---------- */
function drawTruck(tx, ty, anim){
  // tx = rear-left of body, ty = roof line. Wheels bottom = ty+27.
  // shadow stays on the road while the truck jumps, shrinking and fading with height
  const lift = Math.max(0, GY - truck.y);
  const sw = Math.max(18, 46 - lift*0.42);
  g.globalAlpha = Math.max(.06, .25 - lift*0.004);
  P(tx + 2 + (46-sw)/2, GY-2, sw, 3, '#3a2712');
  g.globalAlpha = 1;

  // chassis
  P(tx+2, ty+16, 42, 3, '#1c1f26');

  // --- rear pump body ---
  P(tx,   ty,    28, 16, '#d63a2a');
  P(tx,   ty-2,  28, 3,  '#262b36');
  P(tx+1, ty-3,  26, 1,  '#323848');
  P(tx,   ty+13, 28, 3,  '#a52618');
  P(tx,   ty+7,  28, 4,  '#f2ead8');
  P(tx,   ty+11, 28, 2,  '#f0871c');
  for(let i=3;i<27;i+=5) P(tx+i, ty+1, 1, 6, '#b92c1e');
  P(tx, ty+1, 2, 3, '#ffd23e');
  P(tx, ty+12, 2, 1, '#ffd23e');

  // --- cab ---
  P(tx+28, ty-2, 16, 18, '#d63a2a');
  P(tx+28, ty+13, 16, 3, '#a52618');
  P(tx+28, ty+7, 16, 4, '#f2ead8');
  P(tx+28, ty+11, 16, 2, '#f0871c');
  P(tx+30, ty, 11, 6, '#b8d8e8');
  P(tx+38, ty+1, 2, 4, '#e9f5fb');
  P(tx+30, ty+5, 11, 1, '#8fb6c9');
  const on = (t>>3)&1;
  P(tx+29, ty-5, 5, 3, on ? '#4d7ef2' : '#2a4da8');
  P(tx+34, ty-5, 5, 3, on ? '#c8362a' : '#f25a4d');
  P(tx+29, ty-6, 10, 1, '#20242e');
  P(tx+43, ty+5, 3, 12, '#d63a2a');
  P(tx+44, ty+7, 3, 4, '#ffd23e');
  P(tx+43, ty+14, 5, 3, '#c9ccd2');
  P(tx+46, ty+4, 2, 11, '#9aa0a8');

  // progressive front-end damage as lives are lost
  const dmg = CFG.LIVES - lives;
  if(dmg>=1){
    P(tx+42, ty+5, 4, 3, '#a52618');    // dented bonnet
    P(tx+44, ty+10, 3, 2, '#7a1c10');   // chipped paint
    P(tx+43, ty+15, 4, 2, '#8a8f96');   // scraped bumper
    P(tx+31, ty+14, 6, 2, '#7a1c10');   // gouged front wheel arch
    P(tx+36, ty+13, 4, 1, '#8a8f96');   // bare metal on the arch
    P(tx+31, ty+2, 2, 1, '#e9f5fb');    // cracked windscreen
    P(tx+32, ty+3, 1, 2, '#e9f5fb');
  }
  if(dmg>=2){
    P(tx+44, ty+6, 3, 5, '#5c5c5c');    // busted headlight
    P(tx+45, ty+8, 1, 1, (t>>2)%3===0?'#ffd23e':'#5c5c5c');  // flickering shard
    P(tx+41, ty+4, 5, 3, '#7a1c10');    // crumpled front
    P(tx+46, ty+5, 2, 5, '#6a6f76');    // bent bull bar
    P(tx+42, ty+16, 5, 2, '#57503f');   // dragging bumper corner
    P(tx+29, ty+13, 10, 3, '#5c5c5c');  // crumpled wheel arch
    P(tx+28, ty+16, 2, 3, '#3a3a42');   // hanging mudflap
    P(tx+39, ty+7, 5, 4, '#57503f');    // scorched stripe
  }

  // --- wheels ---
  wheel(tx+9,  ty+21, anim);
  wheel(tx+35, ty+21, anim);

  // --- Chris riding on top of the pump body ---
  const cx = tx+13, bob = truck.ground ? ((t>>4)&1) : 0;
  const hy = ty - bob;
  // torso: dark navy RFS shirt, torn open showing chest
  P(cx-4, hy-12, 10, 10, '#2c3140');
  P(cx-4, hy-12, 10, 1,  '#3d445a');
  P(cx-1, hy-10, 4, 6,   '#e0a878');
  P(cx-1, hy-7,  4, 1,   '#c98a5e');
  P(cx+0, hy-10, 1, 3,   '#c98a5e');
  P(cx-4, hy-9,  1, 2,   '#e0a878');
  P(cx-3, hy-11, 1, 1,   '#e8e2d0');
  // forward arm gripping the light bar - big guns
  P(cx+5,  hy-11, 4, 4, '#e0a878');
  P(cx+5,  hy-11, 4, 1, '#f0c896');    // bicep highlight
  P(cx+8,  hy-10, 5, 3, '#d89a68');
  P(cx+12, hy-9,  3, 4, '#e0a878');
  // back arm: the buff special arm, or a fist pump
  if(spWindup()){
    // wound back, charging with fire
    P(cx-7, hy-13, 7, 5, '#e0a878');
    P(cx-13, hy-16, 8, 8, '#d89a68');   // huge cocked fist
    P(cx-13, hy-16, 8, 2, '#f0c896');
    if((t&1)===0) spawn(cx-10+Math.random()*5, hy-18, (Math.random()-.5), -Math.random(), 8, Math.random()<.5?'#f78a1e':'#ffd23e', 1);
  } else if(spActive()){
    // massive buff arm punched forward
    P(cx+2, hy-15, 14, 7, '#e0a878');
    P(cx+5, hy-16, 10, 3, '#d89a68');   // bicep bulge
    P(cx+2, hy-15, 14, 1, '#f0c896');
    P(cx+16, hy-18, 10, 10, '#d89a68'); // colossal fist
    P(cx+16, hy-18, 10, 2, '#f0c896');
    P(cx+27, hy-16, 6, 1, '#fff8d8');   // motion lines
    P(cx+27, hy-11, 6, 1, '#fff8d8');
  } else if(special>0){
    // recovery: arm coming back
    P(cx+1, hy-13, 9, 5, '#e0a878');
    P(cx+9, hy-13, 5, 5, '#d89a68');
  } else if(((t>>3)&1)===0){
    P(cx-9, hy-13, 4, 5, '#e0a878');
    P(cx-9, hy-13, 1, 5, '#c98a5e');
    P(cx-9, hy-17, 4, 4, '#d89a68');
  } else {
    P(cx-9, hy-11, 4, 5, '#e0a878');
    P(cx-10, hy-12, 4, 3, '#d89a68');
  }
  // head
  P(cx-3, hy-19, 8, 7, '#e8b482');
  P(cx-3, hy-14, 8, 2, '#dca674');
  P(cx+4, hy-18, 1, 5, '#d89a68');
  P(cx+0, hy-17, 1, 1, '#20242c');
  P(cx+3, hy-17, 1, 1, '#20242c');
  P(cx+0, hy-15, 4, 1, '#c08d60');   // 5 o'clock shadow on the lip
  P(cx+0, hy-14, 3, 1, '#8a3324');   // easy grin, no teeth
  // cap
  P(cx-4, hy-21, 9, 3, '#232836');
  P(cx-3, hy-22, 7, 1, '#2c3346');
  P(cx+4, hy-19, 5, 1, '#161a24');
  P(cx-1, hy-21, 2, 1, '#c8402e');
}

function wheel(wx, wy, anim){
  P(wx-5, wy-4, 10, 9, '#1d2026');
  P(wx-4, wy-5, 8, 11, '#1d2026');
  P(wx-2, wy-2, 5, 5, '#98a0a8');
  const f = anim ? (t>>2)%4 : 0;
  g.fillStyle='#4a505c';
  if(f===0||f===2) g.fillRect(wx-2, wy, 5, 1); else g.fillRect(wx, wy-2, 1, 5);
  P(wx, wy, 1, 1, '#1d2026');
}

/* ---------- stump (top-down cut face + root) ---------- */
const SW = s => s.big?22:16;
const SH = s => s.big?17:13;
function drawStump(s){
  const x = s.x|0, w = SW(s), bh = s.big?11:8;
  const gy = GY - (s.yo||0);
  const burnt = s.burn>0;
  const bark  = burnt ? '#3a2a1c' : '#6b452c';
  const barkD = burnt ? '#2a1e14' : '#573823';
  const face  = burnt ? '#7a5a38' : '#e2b26e';
  const ring  = burnt ? '#5c4228' : '#b9854a';
  // root snaking out the front
  P(x-7, gy-4, 8, 3, bark);
  P(x-12, gy-3, 6, 3, barkD);
  P(x-6, gy-6, 3, 2, bark);

/* ---------- game flow ---------- */
function reset(){
  stumps=[]; medals=[]; parts=[]; dist=0; speed=CFG.BASE_SPEED;
  score=0; stumpsCleared=0; smashed=0; lives=CFG.LIVES;
  truck.y=GY; truck.vy=0; truck.ground=true;
  power=0; special=0; hitstop=0; invuln=0; redFlash=0; jumpBuf=0; coyote=0;
  nextSpawn=W+160; nextMedal=260; dead=0; newBest=false;
  captain=null; nextCaptain=1400;
  brett=null; nextBrett=2600; cameoCooldown=0;
  startMusic();
  announce('Game started');
}
function startJump(){ truck.vy=CFG.JUMP_VELOCITY; truck.ground=false; coyote=0; jumpBuf=0; sfx('jump'); }
function jump(){
  if(state==='title'){ state='play'; reset(); return; }
  if(state==='over'){ if(dead>35){ state='play'; reset(); } return; }
  if(state==='paused'){ resume(); return; }
  if(truck.ground || coyote>0) startJump();
  else jumpBuf = CFG.JUMP_BUFFER_TICKS;
}
function endJump(){ if(!truck.ground && truck.vy<CFG.JUMP_CUT) truck.vy=CFG.JUMP_CUT; }
function doSpecial(){
  if(state!=='play' || special>0 || power<CFG.SPECIAL_CHARGE_REQUIRED) return;
  special=CFG.SPECIAL_DURATION; power=0; shake=RM?3:8; sfx('punch');
}
function addCharge(n){
  const was = power;
  power = Math.min(CFG.SPECIAL_CHARGE_REQUIRED, power+n);
  if(power>=CFG.SPECIAL_CHARGE_REQUIRED && was<CFG.SPECIAL_CHARGE_REQUIRED){ sfx('ready'); announce('Special move ready'); }
  else sfx('medal');
}
function knockInRange(){
  const fx = truck.x+48;
  for(const s of stumps){
    if(s.fly || s.burn>0) continue;
    if(s.x < fx + CFG.SPECIAL_ATTACK_RANGE && s.x+SW(s) > fx-6){
      s.fly=true; s.vx=2.5+Math.random()*2; s.vyo=3+Math.random()*1.5; s.yo=0;
      smashed++; score += CFG.SPECIAL_DESTROY_BONUS; sfx('smash');
      for(let i=0;i<10;i++) spawn(s.x+SW(s)/2, GY-10, (Math.random()-.3)*3, -Math.random()*2.5, 22, ['#f78a1e','#ffd23e','#6b452c','#e2b26e'][i%4], 2);
    }
  }
  // Santa is not exempt from the STUMP SMASH
  if(brett && !brett.fly && brett.x < fx + CFG.SPECIAL_ATTACK_RANGE && brett.x+6 > fx-6){
    brett.fly=true; brett.vx=3; brett.vyo=3.5; brett.yo=0;
    score += CFG.SPECIAL_DESTROY_BONUS; sfx('smash');
    for(let i=0;i<8;i++) spawn(brett.x, GY-12, (Math.random()-.3)*3, -Math.random()*2.5, 22, ['#c8362a','#f2f2ec','#f78a1e'][i%3], 2);
  }
}
function hit(hitStump){
  lives--; power=0;
  hitstop = CFG.HITSTOP_TICKS; invuln = CFG.INVULN_TICKS;
  redFlash = RM?0:10; shake = RM?4:12; sfx('crash');
  // knock the offending stump away so it can't hit twice
  hitStump.fly=true; hitStump.vx=3; hitStump.vyo=3.5; hitStump.yo=0;
  for(let i=0;i<16;i++) spawn(truck.x+40+Math.random()*10, GY-14+Math.random()*10, (Math.random()-.4)*2.5, -Math.random()*2, 26, ['#9aa0a8','#f78a1e','#6b452c'][i%3], 2);
  if(lives<=0){
    state='over'; dead=0; stopMusic();
    if(Math.floor(score)>hs){ hs=Math.floor(score); newBest=true; ls.set('cm_hs', hs); }
    announce('Game over. Score ' + Math.floor(score));
  } else {
    announce(lives + (lives===1?' life':' lives') + ' remaining');
  }
}
function pause(){ if(state==='play'){ state='paused'; stopMusic(); announce('Paused'); } }
function resume(){ if(state==='paused'){ state='play'; startMusic(); announce('Resumed'); } }

function update(){
  t++;
  if(shake>0) shake--;
  if(redFlash>0) redFlash--;
  updateParts();
  if(state==='over'){ dead++; return; }
  if(state!=='play') return;
  if(hitstop>0){ hitstop--; return; }   // freeze-frame impact feedback

  speed = Math.min(CFG.MAX_SPEED, CFG.BASE_SPEED + dist*CFG.SPEED_RAMP);
  dist += speed;
  score += speed*0.1;

  // physics
  if(!truck.ground){ truck.vy += CFG.GRAVITY; truck.y += truck.vy; }
  else if(coyote<CFG.COYOTE_TICKS) coyote=CFG.COYOTE_TICKS;
  if(truck.y >= GY && !truck.ground){
    truck.y=GY; truck.vy=0; truck.ground=true; dustBurst(); sfx('land');
    if(jumpBuf>0) startJump();            // buffered jump
  }
  if(jumpBuf>0) jumpBuf--;
  if(coyote>0 && truck.ground===false) coyote--;
  if(invuln>0) invuln--;
  if(truck.ground && (t&1)===0) spawn(truck.x+4, GY-2, -speed*.5-Math.random()*.5, -Math.random()*.8, 14+Math.random()*8, Math.random()<.5?'#c9a878':'#b08d5e', 2);
  // last life: the old girl is smoking from the bonnet
  if(lives===1 && (t&3)===0) spawn(truck.x+43+Math.random()*4, truck.y-23, .2+Math.random()*.4, -.9-Math.random()*.6, 26+Math.random()*12, Math.random()<.5?'#8f959d':'#6a6f76', 2);

  // spawn stumps - gaps always leave landing + reaction room
  nextSpawn -= speed;
  if(nextSpawn<=0){
    const big = Math.random()<CFG.BIG_STUMP_CHANCE;
    const heat = Math.max(0, Math.min(1, (speed-CFG.FIRE_MIN_SPEED)/(CFG.MAX_SPEED-CFG.FIRE_MIN_SPEED)));
    const flame = Math.random() < CFG.FIRE_CHANCE*heat;
    stumps.push({x:W+24, big, burn:0, flame});
    let clusterW = 0;
    if(!big && speed>CFG.PAIR_MIN_SPEED && Math.random()<CFG.PAIR_CHANCE){
      stumps.push({x:W+24+24, big:false, burn:0});   // tight pair: one jump clears both
      clusterW = 24;
    }
    if(Math.random()<CFG.MEDAL_ON_STUMP_CHANCE){ medals.push({x:W+24+clusterW/2, y:GY-40-Math.random()*8}); nextMedal=CFG.MEDAL_MIN+Math.random()*CFG.MEDAL_VAR; }
    nextSpawn = CFG.SPAWN_MIN + Math.random()*CFG.SPAWN_VAR + speed*CFG.SPAWN_SPEED_PAD + clusterW;
  }
  nextMedal -= speed;
  if(nextMedal<=0){ medals.push({x:W+16, y:GY-32-Math.random()*16}); nextMedal=CFG.MEDAL_MIN+Math.random()*CFG.MEDAL_VAR; }

  // move world
  for(const s of stumps){
    if(s.fly){ s.x += s.vx; s.yo += s.vyo; s.vyo -= .28; }
    else s.x -= speed;
  }
  for(const m of medals) m.x -= speed;

  // Steve the captain: runs in from ahead, tries to keep up below the truck,
  // then trips into a flaming cowpat and is gone
  nextCaptain -= speed;
  if(cameoCooldown>0) cameoCooldown -= speed;
  if(!captain && !brett && cameoCooldown<=0 && nextCaptain<=0){
    captain = { x: W+24, phase:'in', hold: CFG.POOP_DELAY_TICKS, nag: NAGS[(Math.random()*NAGS.length)|0] };
    nextCaptain = CFG.CAPTAIN_MIN_GAP + Math.random()*CFG.CAPTAIN_GAP_VAR;
    sfx('nag');
  }
  if(captain){
    if(captain.phase==='in'){
      captain.x -= speed + 1.6;
      if(captain.x <= CFG.STEVE_X) captain.phase='chase';
    } else if(captain.phase==='chase'){
      captain.hold--;
      captain.x += (CFG.STEVE_X - captain.x)*.1;   // holds position out in front of Chris
      // the setup: fence and/or cow, both optional via settings
      if(captain.hold<=0 && !captain.setup){
        captain.setup=true;
        if(CFG.SHOW_FENCE) captain.fence={x:W+20};
        if(!CFG.SHOW_FENCE && !CFG.SHOW_COW) captain.pat={x:W+40};
      }
      if(captain.setup && CFG.SHOW_COW && !captain.cow && !captain.pat &&
         (!CFG.SHOW_FENCE || (captain.fence && captain.fence.x<=captain.x+CFG.COW_POOP_OFFSET_X-30)))
        captain.cow={x:W+30,squat:0,pooped:false};
      if(captain.setup && !CFG.SHOW_COW && CFG.SHOW_FENCE && !captain.pat &&
         captain.fence && captain.fence.x<=captain.x+CFG.COW_POOP_OFFSET_X-30)
        captain.pat={x:captain.fence.x+60};
      if(captain.fence){
        captain.fence.x -= speed;
        if(!captain.jumped && captain.fence.x<=captain.x+16){ captain.vyo=2.8; captain.jumped=true; sfx('jump'); }
      }
      const cw=captain.cow;
      if(cw){
        if(!cw.pooped && cw.x<=captain.x+CFG.COW_POOP_OFFSET_X){
          cw.squat++; cw.x-=speed;           // pulls up, does the deed
          if(cw.squat>=16){
            cw.pooped=true; captain.pat={x:cw.x+20}; sfx('pop');
            for(let i=0;i<4;i++) spawn(cw.x+19,GY+2-Math.random()*5,.2,.2+Math.random()*.3,12,'#5a4226',2);
          }
        } else cw.x -= speed + (cw.pooped ? .8 : 1.2);
        if(cw.x<-45) captain.cow=null;
      }
      if(captain.pat){
        captain.pat.x -= speed;
        if(captain.pat.x <= captain.x+4 && (captain.yo||0)<3){ captain.phase='trip'; sfx('pop'); }
      }
      // fence-hop physics
      if(captain.vyo || captain.yo){ captain.yo=(captain.yo||0)+captain.vyo; captain.vyo-=.3; if(captain.yo<=0){ captain.yo=0; captain.vyo=0; } }
    } else {
      captain.x -= speed;
      if(captain.pat) captain.pat.x -= speed;
      if(captain.fence) captain.fence.x -= speed;
      if(captain.cow) captain.cow.x -= speed+.8;
      if(captain.x < -40){ captain=null; cameoCooldown=CFG.CAMEO_COOLDOWN; }
    }
  }

  // Brett: rare Santa-suited obstacle dispensing station standards
  nextBrett -= speed;
  if(!brett && !captain && cameoCooldown<=0 && nextBrett<=0 && nextSpawn>70 && !stumps.some(s=>s.x>W-80)){
    brett = { x: CFG.BRETT_SPAWN_X, hold: CFG.BRETT_HOLD_TICKS, nag: BRETT_NAGS[(Math.random()*BRETT_NAGS.length)|0] };
    nextBrett = CFG.BRETT_MIN_GAP + Math.random()*CFG.BRETT_GAP_VAR;
    nextSpawn += 90;                       // landing room after Brett
    sfx('nag');
  }
  if(brett){
    if(brett.fly){ brett.x += brett.vx; brett.yo=(brett.yo||0)+brett.vyo; brett.vyo -= .28; }
    else if(brett.hold>0 && brett.x <= CFG.BRETT_HOLD_X) brett.hold--;   // hangs about so you can read the lecture
    else brett.x -= speed;
    if(!brett.counted && !brett.fly && brett.x+6 < truck.x+6){ brett.counted=true; score += CFG.CLEAR_BONUS; }
    if(brett && (brett.x < -40 || brett.x > W+80 || GY-(brett.yo||0) > H+30)){ brett=null; cameoCooldown=CFG.CAMEO_COOLDOWN; }
  }

  // airborne stump clears award score (medals are the only special charge)
  for(const s of stumps){
    if(!s.counted && !s.fly && s.burn===0 && s.x+SW(s) < truck.x+6){
      s.counted=true; stumpsCleared++; score += CFG.CLEAR_BONUS;
    }
  }
  stumps = stumps.filter(s=> s.x>-40 && s.x<W+60 && s.burn<26 && (!s.fly || GY-s.yo < H+30));

  // special punch: strike frames destroy stumps in range
  if(special>0){
    special--;
    if(spActive()) knockInRange();
  }

  // medal pickup (truck + Chris hitbox)
  const ty = truck.y-27;
  medals = medals.filter(m=>{
    if(m.x < -12) return false;
    if(m.x < truck.x+46 && m.x+10 > truck.x+2 && m.y-6 < ty+18 && m.y+8 > ty-24){
      addCharge(1); score += CFG.MEDAL_BONUS;
      for(let i=0;i<6;i++) spawn(m.x+4, m.y, (Math.random()-.5)*1.6, -Math.random()*1.4, 16, i%2?'#f6d868':'#fffbe0', 1);
      return false;
    }
    return true;
  });

  // collision (skipped while invulnerable or during active strike frames)
  if(invuln<=0 && !spActive()){
    for(const s of stumps){
      if(s.burn>0 || s.fly) continue;
      const w = SW(s), h = SH(s) + (s.flame?CFG.FIRE_EXTRA_HEIGHT:0);
      if(truck.x+8 < s.x+w-2 && truck.x+44 > s.x+2 && truck.y-1 > GY-h+1){ hit(s); break; }
    }
  }
  // Brett is a soft obstacle - bumping him just sends Santa flying, no damage
  if(brett && !brett.fly && truck.x+8 < brett.x+5 && truck.x+44 > brett.x-4 && truck.y-1 > GY+CFG.BRETT_Y_OFFSET-19){
    brett.fly=true; brett.vx=3; brett.vyo=3.5; brett.yo=0; sfx('pop');
    for(let i=0;i<8;i++) spawn(brett.x, GY-12, (Math.random()-.3)*2.5, -Math.random()*2.2, 22, ['#c8362a','#f2f2ec'][i%2], 2);
  }
}

/* ---------- text (drawn on the 4x overlay so it stays sharp) ---------- */
function txt(s, x, y, size, c, align, plain){
  ug.font = 'bold ' + (size*S) + 'px Consolas, Menlo, monospace';
  ug.textAlign = align||'left';
  if(!plain){ ug.fillStyle = '#1c1408'; ug.fillText(s, x*S+2, y*S+2); }
  ug.fillStyle = c; ug.fillText(s, x*S, y*S);
}

/* fullscreen / mute / pause icons, top-right (also the touch targets) */
function drawIcons(){
  const lit='#f2ead8', dim='#c9b98a';
  if(canRotate){
    P(W-72, 4, 14, 11, '#20242e');
    const rx=W-70, ry=6, c=rotLocked?lit:dim;
    P(rx+1, ry+3, 4, 6, c);  P(rx+2, ry+4, 2, 4, '#20242e');   // portrait phone
    P(rx+6, ry+5, 6, 4, c);  P(rx+7, ry+6, 4, 2, '#20242e');   // landscape phone
    P(rx+2, ry, 6, 1, c); P(rx+8, ry+1, 1, 1, c); P(rx+7, ry, 1, 2, c);  // turn arrow
  }
  if(fsOK){
    P(W-54, 4, 14, 11, '#20242e');
    const bx=W-51, by=6, c=isFs()?lit:dim;      // corner brackets
    P(bx,by,3,1,c);     P(bx,by,1,2,c);
    P(bx+6,by,3,1,c);   P(bx+8,by,1,2,c);
    P(bx,by+6,3,1,c);   P(bx,by+5,1,2,c);
    P(bx+6,by+6,3,1,c); P(bx+8,by+5,1,2,c);
  }
  // mute
  P(W-36, 4, 14, 11, '#20242e');
  P(W-33, 7, 3, 5, dim); P(W-30, 5, 2, 9, dim);
  if(mute){ P(W-27, 6, 4, 1, '#e04a1e'); P(W-27, 9, 4, 1, '#e04a1e'); P(W-25, 7, 1, 3, '#e04a1e'); }
  else { P(W-27, 7, 1, 5, dim); P(W-25, 6, 1, 7, dim); }
  // pause / play
  P(W-18, 4, 14, 11, '#20242e');
  if(state==='paused'){ P(W-14, 6, 2, 7, dim); P(W-12, 7, 2, 5, dim); P(W-10, 8, 2, 3, dim); }
  else { P(W-15, 6, 3, 7, dim); P(W-10, 6, 3, 7, dim); }
}

function draw(){
  g.save();
  const shx = shake>0 ? (Math.random()*2-1)*(RM?1:2)|0 : 0;
  const shy = shake>0 ? (Math.random()*2-1)*1.5|0 : 0;
  if(shake>0) g.translate(shx, shy);
  ug.setTransform(1,0,0,1,0,0);
  ug.clearRect(0,0,uv.width,uv.height);
  ug.translate(shx*S, shy*S);
  drawBg();
  for(const s of stumps) drawStump(s);
  for(const m of medals) drawMedal(m);
  if(brett) drawBrett(brett);

  const tx = truck.x, ty = truck.y-27;
  const blink = invuln>0 && ((t>>2)&1)===0;
  if(state==='over'){
    drawTruck(tx, ty+1, false);
    if((t>>3)%2===0) txt('!', tx+20, ty-26, 10, '#ffd23e');
  } else if(!blink){
    drawTruck(tx, ty, truck.ground && state==='play');
    if(spActive()) drawBurst(tx, ty);
    if(special>0 && spActive() && (t>>2)%2===0){
      txt('STUMP',  tx+72, ty-17, 10, '#ffd23e');
      txt('SMASH!', tx+72, ty-6,  10, '#ffd23e');
    }
  }
  if(captain) drawCaptain(captain);
  drawParts();
  if(captain && captain.phase!=='trip' && captain.x < W+10) drawBubble(captain);
  if(brett && !brett.fly && brett.x > truck.x+70 && brett.x < W-10) drawBubble(brett);

  if(CFG.DEBUG_COLLISION_BOXES){
    g.globalAlpha=.5;
    P(truck.x+8, truck.y-28, 36, 27, '#00e0ff');
    for(const s of stumps) if(!s.fly&&s.burn===0){ const fh=s.flame?CFG.FIRE_EXTRA_HEIGHT:0; P(s.x+2, GY-SH(s)+1-fh, SW(s)-4, SH(s)-1+fh, '#ff00aa'); }
    if(spActive()) P(truck.x+48, GY-30, CFG.SPECIAL_ATTACK_RANGE, 30, '#ffee00');
    g.globalAlpha=1;
  }

  // red edge flash after losing a life
  if(redFlash>0){
    g.globalAlpha = redFlash/20;
    P(0,0,W,4,'#e04a1e'); P(0,H-4,W,4,'#e04a1e'); P(0,0,4,H,'#e04a1e'); P(W-4,0,4,H,'#e04a1e');
    g.globalAlpha=1;
  }

  // ---- HUD ----
  if(state!=='title'){
    txt('SCORE ' + String(Math.floor(score)).padStart(6,'0'), 6, 12, 9, '#fff');
    txt('BEST ' + hs, W-(canRotate?76:58), 12, 9, '#ffe9a8', 'right');
    // special meter
    const ready = power>=CFG.SPECIAL_CHARGE_REQUIRED;
    for(let i=0;i<CFG.SPECIAL_CHARGE_REQUIRED;i++){
      P(6+i*10, 17, 9, 7, '#20242e');
      if(i<power) P(7+i*10, 18, 7, 5, ready && (t>>3)%2===0 ? '#fff0a8' : '#e8b93e');
    }
    txt(ready ? 'SPECIAL READY' : 'SPECIAL', 58, 24, 7, ready?'#ffd23e':'#c9b98a');
    // lives
    for(let i=0;i<CFG.LIVES;i++) drawHelmet(6+i*11, 29, i<lives);
  }
  if(state==='title'){
    g.globalAlpha=.66; P(0,0,W,H,'#10131c'); g.globalAlpha=1;
    txt('CHRISMANIA', W/2, 40, 26, '#ffd23e', 'center');
    txt('N S W  R F S  S T U M P  R U N', W/2, 54, 8, '#f2ead8', 'center');
    txt('EUNGAI BRIGADE', W/2, 66, 8, '#f08c8c', 'center');
    txt('JUMP THE STUMPS, GRAB RFS MEDALS,', W/2, 84, 8, '#fff', 'center');
    txt('CHARGE UP AND SMASH THROUGH DANGER.', W/2, 93, 8, '#fff', 'center');
    // controls card - keeps the scrolling scene from tangling with the text
    g.globalAlpha=.88; P(60, 100, 200, 42, '#0d1016'); g.globalAlpha=1;
    P(60, 100, 200, 1, '#3a4150'); P(60, 141, 200, 1, '#3a4150');
    P(60, 100, 1, 42, '#3a4150'); P(259, 100, 1, 42, '#3a4150');
    txt('JUMP',        W/2-8, 114, 8, '#c9b98a', 'right');
    txt('SPACE / TAP', W/2+8, 114, 8, '#f6d868');
    txt('SPECIAL',     W/2-8, 125, 8, '#c9b98a', 'right');
    txt('CTRL / X',    W/2+8, 125, 8, '#f6d868');
    txt('ESC PAUSE    M MUTE    F FULLSCREEN', W/2, 136, 7, '#8a8272', 'center');
    if(hs>0) txt('BEST ' + hs, W/2, 155, 8, '#ffe9a8', 'center');
    if((t>>4)%2===0) txt('PRESS SPACE / TAP TO START', W/2, 171, 9, '#ffd23e', 'center');
  }
  if(state==='paused'){
    g.globalAlpha=.55; P(0,0,W,H,'#10131c'); g.globalAlpha=1;
    txt('PAUSED', W/2, 84, 18, '#f2ead8', 'center');
    txt('ESC / TAP TO RESUME', W/2, 102, 9, '#ffd23e', 'center');
  }
  if(state==='over'){
    g.globalAlpha=.62; P(0,34,W,108,'#10131c'); g.globalAlpha=1;
    txt('STUMPED!', W/2, 62, 22, '#e04a1e', 'center');
    txt('SCORE ' + Math.floor(score), W/2, 80, 11, '#fff', 'center');
    txt('STUMPS CLEARED ' + stumpsCleared + '   SMASHED ' + smashed, W/2, 94, 8, '#f6d868', 'center');
    txt('BEST ' + hs, W/2, 106, 9, '#ffe9a8', 'center');
    if(newBest && (t>>3)%2===0) txt('NEW BRIGADE RECORD!', W/2, 118, 8, '#ffd23e', 'center');
    if(dead>35 && (t>>4)%2===0) txt('SPACE / TAP TO GO AGAIN', W/2, 118+(newBest?12:0), 8, '#f2ead8', 'center');
  }
  drawIcons();   // on top of every overlay so they stay tappable
  // touch special button (lower-left): STUMP SMASH! - jump is anywhere else
  if(state==='play'){
    const ready = power>=CFG.SPECIAL_CHARGE_REQUIRED && special<=0;
    const pulse = ready && (t>>3)%2===0;
    const bx=4, by=H-32;
    g.globalAlpha = ready ? .95 : .5;
    P(bx, by, 56, 28, '#20242e');
    P(bx+1, by+1, 54, 26, ready ? (pulse?'#96381c':'#7a2c16') : '#2e2a24');
    txt('STUMP',  bx+28, by+12, 9, ready ? (pulse?'#ffe98a':'#ffd23e') : '#8a8272', 'center');
    txt('SMASH!', bx+28, by+23, 9, ready ? (pulse?'#ffe98a':'#f78a1e') : '#8a8272', 'center');
    g.globalAlpha=1;
  }
  g.restore();
}

/* ---------- fixed-timestep loop (60Hz updates on any refresh rate) ---------- */
let last=performance.now(), acc=0;
function loop(now){
  const dt = Math.min(100, now-last); last=now; acc+=dt;   // clamp tab-return spikes
  while(acc>=16.667){ update(); acc-=16.667; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- input ---------- */
addEventListener('keydown', e=>{
  if(e.repeat) return;
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW'){ e.preventDefault(); jump(); }
  else if(e.code==='Enter'){ if(state==='title'||state==='over') jump(); }
  else if(e.code==='ControlLeft' || e.code==='ControlRight' || e.code==='KeyX'){ doSpecial(); }
  else if(e.code==='Escape'){ state==='paused' ? resume() : pause(); }
  else if(e.code==='KeyM'){ toggleMute(); }
  else if(e.code==='KeyF'){ toggleFullscreen(); }
});
addEventListener('keyup', e=>{
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='KeyW') endJump();
});
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX-r.left)/r.width*W, y = (e.clientY-r.top)/r.height*H;
  // icon row works in every state; unavailable icons fall through to a jump
  if(y<18){
    if(canRotate && x>W-74 && x<W-56){ toggleRotate(); return; }
    if(fsOK && x>W-56 && x<W-38){ toggleFullscreen(); return; }
    if(x>W-38 && x<W-20){ toggleMute(); return; }
    if(x>W-20){ if(state==='paused') resume(); else pause(); return; }
  }
  if(state==='play' && x<64 && y>H-36){ doSpecial(); return; }
  jump();
});
cv.addEventListener('pointerup', endJump);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) pause(); });
</script>
